<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Task Constellation Map</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Cytoscape.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

    <style>
        :root {
            --bg-color: #141526;
            --panel-bg: rgba(20, 21, 38, 0.95);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #FFFFFF;
            --text-muted: #9CA3AF;

            --high-color: #FB7185;
            --medium-color: #FCD34D;
            --low-color: #60A5FA;

            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            background-image: radial-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px);
            background-size: 50px 50px;
            background-position: 0 0;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(10, 11, 20, 0.8) 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* 3D Globe Container */
        #globe-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 900px;
            height: 900px;
            z-index: 1;
            pointer-events: none;
        }

        #cy {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }

        /* Top Right Navigation */
        .top-right-nav {
            position: absolute;
            top: 30px;
            right: 30px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: #9CA3AF;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 170px;
            text-align: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #FFFFFF;
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        .nav-btn.active {
            background: rgba(255, 255, 255, 0.95);
            color: #000000;
            border-color: #FFFFFF;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
        }

        /* Side Panel */
        #side-panel {
            position: absolute;
            top: 0;
            left: -550px;
            width: 500px;
            height: 100%;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-color);
            z-index: 20;
            transition: left 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 40px;
            display: flex;
            flex-direction: column;
            box-shadow: 20px 0 50px rgba(0, 0, 0, 0.5);
            overflow-y: auto;
        }

        #side-panel.open {
            left: 0;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #fff;
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .panel-tag {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-main);
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        #panel-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #fff;
        }

        #panel-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 6px;
        }

        /* Task Database List Styling */
        .tasks-live-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
        }

        .task-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 14px;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            cursor: pointer;
        }

        .task-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .task-card.priority-high {
            border-left-color: var(--high-color);
        }

        .task-card.priority-medium {
            border-left-color: var(--medium-color);
        }

        .task-card.priority-low {
            border-left-color: var(--low-color);
        }

        .task-card-title {
            font-size: 13px;
            font-weight: 600;
            color: #E2E8F0;
            margin-bottom: 6px;
        }

        .task-card-meta {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 10px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-high {
            background: rgba(251, 113, 133, 0.15);
            color: #FB7185;
            border: 1px solid rgba(251, 113, 133, 0.3);
        }

        .badge-medium {
            background: rgba(252, 211, 77, 0.15);
            color: #FCD34D;
            border: 1px solid rgba(252, 211, 77, 0.3);
        }

        .badge-low {
            background: rgba(96, 165, 250, 0.15);
            color: #60A5FA;
            border: 1px solid rgba(96, 165, 250, 0.3);
        }

        .subtasks-container {
            margin-top: 10px;
            margin-left: 10px;
            border-left: 1px dashed rgba(255, 255, 255, 0.15);
            padding-left: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .subtask-item {
            font-size: 11px;
            color: #94A3B8;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 16px;
            margin-top: auto;
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .action-btn:hover {
            background: #E2E8F0;
        }
    </style>
</head>

<body>

    <!-- Navigation buttons -->
    <div class="top-right-nav">
        <button class="nav-btn active" id="btn-execution">Execution</button>
        <button class="nav-btn" id="btn-logs" onclick="window.location.href='agent_talk.task_log.html'">Task
            Logs/Chat</button>
        <button class="nav-btn" id="btn-plan">Plan</button>
        <button class="nav-btn" id="btn-apis">APIs/MCPs</button>
    </div>

    <!-- Map Wrapper -->
    <div id="map-wrapper"
        style="width: 100%; height: 100%; position: absolute; transform: scale(1.0); transform-origin: center;">

        <!-- 3D Rotating Stardust Globe (The Brain) -->
        <div id="globe-container"></div>
        <div id="globe-click-target"
            style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 180px; height: 180px; border-radius: 50%; z-index: 3; cursor: pointer; pointer-events: auto;">
        </div>

        <div id="cy"></div>
    </div>

    <!-- Side Panel -->
    <div id="side-panel">
        <button class="close-btn" onclick="closePanel()">×</button>

        <div class="panel-header">
            <h2 id="panel-title">TASK DATABASE</h2>
            <span class="panel-tag" id="panel-type">LIVE</span>
        </div>

        <p id="panel-desc">Live view of all tasks in the second brain database.</p>

        <!-- Full Task Database Overview (Mode 1) -->
        <div id="panel-overview-section" style="display: flex; flex: 1; flex-direction: column; overflow: hidden;">
            <div class="section-title">TASKS & SUBTASKS</div>
            <div class="tasks-live-list" id="tasks-live-list">
                <div style="color: var(--text-muted); font-size: 12px;">Loading tasks...</div>
            </div>
        </div>

        <!-- Task Detail View (Mode 2) -->
        <div id="panel-detail-section" style="display: none; flex-direction: column; gap: 14px; overflow-y: auto;">
            <div class="section-title">TASK DETAILS</div>
            <div id="specific-task-meta"
                style="font-size: 11px; display: flex; flex-direction: column; gap: 8px; background: rgba(255,255,255,0.02); padding: 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.05);">
            </div>

            <div class="section-title">NOTES & SUBTASKS</div>
            <div id="specific-task-children" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>

        <div class="action-box">
            <button class="action-btn" id="action-btn">Add New Task</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. THREE.JS SMOKY NEBULA GLOBE (THE BRAIN)
        // ==========================================
        const container = document.getElementById('globe-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
        camera.position.z = 2.5;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
        renderer.setSize(900, 900);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // High-resolution particle texture
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createRadialGradient(256, 256, 0, 256, 256, 256);
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(0.15, 'rgba(235,245,255,0.95)');
        gradient.addColorStop(0.35, 'rgba(160,200,255,0.6)');
        gradient.addColorStop(0.65, 'rgba(120,160,255,0.18)');
        gradient.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 512, 512);
        const texture = new THREE.CanvasTexture(canvas);

        const smokeGeo = new THREE.BufferGeometry();
        const smokeCount = 12000;
        const posArray = new Float32Array(smokeCount * 3);
        const colorArray = new Float32Array(smokeCount * 3);
        const dirs = [];
        const speeds = [];
        const distances = [];
        const maxDistance = 1.1;
        const baseColor = new THREE.Color(0xaabbff);

        for (let i = 0; i < smokeCount; i++) {
            let theta = Math.random() * 2 * Math.PI;
            let phi = Math.acos(2 * Math.random() - 1);
            let dx = Math.sin(phi) * Math.cos(theta);
            let dy = Math.sin(phi) * Math.sin(theta);
            let dz = Math.cos(phi);

            dirs.push({ x: dx, y: dy, z: dz });
            let dist = Math.random() * maxDistance;
            distances.push(dist);
            speeds.push(0.0015 + Math.random() * 0.0035);

            let idx = i * 3;
            posArray[idx] = dx * dist;
            posArray[idx + 1] = dy * dist;
            posArray[idx + 2] = dz * dist;

            let factor = Math.pow(1.0 - (dist / maxDistance), 1.5);
            colorArray[idx] = baseColor.r * factor;
            colorArray[idx + 1] = baseColor.g * factor;
            colorArray[idx + 2] = baseColor.b * factor;
        }

        smokeGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        smokeGeo.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));

        const smokeMat = new THREE.PointsMaterial({
            size: 0.038,
            map: texture,
            transparent: true,
            opacity: 0.9,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            vertexColors: true
        });

        const nebula = new THREE.Points(smokeGeo, smokeMat);
        scene.add(nebula);

        const coreGeo = new THREE.BufferGeometry();
        const coreCount = 3500;
        const corePosArray = new Float32Array(coreCount * 3);
        for (let i = 0; i < coreCount * 3; i += 3) {
            let r = Math.pow(Math.random(), 1.2) * 0.58;
            let theta = Math.random() * 2 * Math.PI;
            let phi = Math.acos(2 * Math.random() - 1);
            corePosArray[i] = r * Math.sin(phi) * Math.cos(theta);
            corePosArray[i + 1] = r * Math.sin(phi) * Math.sin(theta);
            corePosArray[i + 2] = r * Math.cos(phi);
        }
        coreGeo.setAttribute('position', new THREE.BufferAttribute(corePosArray, 3));
        const coreMat = new THREE.PointsMaterial({
            size: 0.038,
            map: texture,
            transparent: true,
            opacity: 0.7,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            color: 0xffffff
        });
        const core = new THREE.Points(coreGeo, coreMat);
        scene.add(core);

        // Glowing laser conduit lines and pulses to power the tasks
        const pulses = [];
        const conduitsGroup = new THREE.Group();
        scene.add(conduitsGroup);

        function updateTaskConduits(roots) {
            // Clear existing conduits
            while (conduitsGroup.children.length > 0) {
                const child = conduitsGroup.children[0];
                conduitsGroup.remove(child);
                if (child.geometry) child.geometry.dispose();
                if (child.material) child.material.dispose();
            }
            pulses.length = 0;

            if (!roots || roots.length === 0) return;

            // 3D globe coordinate mapping (900x900 canvas, camera at z=2.5, fov=45)
            // Screen center is (0,0,0) in Three.js world space.
            // Screen offset (px) to Three.js world units factor:
            const aspect = 1;
            const vFOV = THREE.MathUtils.degToRad(camera.fov);
            const visibleHeight = 2 * Math.tan(vFOV / 2) * camera.position.z;
            const visibleWidth = visibleHeight * aspect;
            // 900px canvas maps to visibleWidth/visibleHeight
            const pxToWorld = visibleWidth / 900;

            roots.forEach(t => {
                const nodeId = 'task_' + t.id;
                const pos = nodesPositions[nodeId];
                if (!pos) return;

                // Screen offset relative to center (900x900 center is CENTER_X, CENTER_Y)
                const dxPx = pos.x - CENTER_X;
                const dyPx = pos.y - CENTER_Y;

                const tx = dxPx * pxToWorld;
                const ty = -dyPx * pxToWorld; // inverted Y for 3D

                const angle = Math.atan2(ty, tx);
                const targetDist = Math.sqrt(tx * tx + ty * ty);
                const startDist = 0.15;

                const pColor = getPriorityColor(t.priority);

                // Faint laser conduit line
                const points = [];
                points.push(new THREE.Vector3(Math.cos(angle) * startDist, Math.sin(angle) * startDist, 0));
                points.push(new THREE.Vector3(tx, ty, 0));
                const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
                const lineMat = new THREE.LineBasicMaterial({
                    color: pColor,
                    transparent: true,
                    opacity: 0.22,
                    blending: THREE.AdditiveBlending
                });
                const line = new THREE.Line(lineGeo, lineMat);
                conduitsGroup.add(line);

                // Staggered traveling light pulses along line toward task node
                const pulseCount = 3;
                for (let pIdx = 0; pIdx < pulseCount; pIdx++) {
                    const spriteMat = new THREE.SpriteMaterial({
                        map: texture,
                        color: 0xffffff,
                        transparent: true,
                        opacity: 0.9,
                        blending: THREE.AdditiveBlending
                    });
                    const sprite = new THREE.Sprite(spriteMat);
                    sprite.scale.set(0.12, 0.12, 1);
                    conduitsGroup.add(sprite);

                    pulses.push({
                        sprite: sprite,
                        startX: Math.cos(angle) * startDist,
                        startY: Math.sin(angle) * startDist,
                        targetX: tx,
                        targetY: ty,
                        progress: (pIdx / pulseCount) + (Math.random() * 0.1),
                        speed: 0.003 + Math.random() * 0.003,
                        color: new THREE.Color(pColor)
                    });
                }
            });
        }

        const posAttribute = nebula.geometry.attributes.position;
        const colorAttribute = nebula.geometry.attributes.color;

        function animateGlobe() {
            requestAnimationFrame(animateGlobe);
            nebula.rotation.y -= 0.0008;
            core.rotation.y += 0.002;
            core.rotation.x += 0.0005;

            for (let i = 0; i < smokeCount; i++) {
                let dist = distances[i] + speeds[i];
                if (dist > maxDistance) dist = 0;
                distances[i] = dist;

                let dir = dirs[i];
                let idx = i * 3;
                posAttribute.array[idx] = dir.x * dist;
                posAttribute.array[idx + 1] = dir.y * dist;
                posAttribute.array[idx + 2] = dir.z * dist;

                let factor = Math.pow(1.0 - (dist / maxDistance), 1.5);
                colorAttribute.array[idx] = baseColor.r * factor;
                colorAttribute.array[idx + 1] = baseColor.g * factor;
                colorAttribute.array[idx + 2] = baseColor.b * factor;
            }

            posAttribute.needsUpdate = true;
            colorAttribute.needsUpdate = true;

            // Animate energy light pulses traveling along lines toward tasks
            pulses.forEach(p => {
                p.progress += p.speed;
                if (p.progress > 1) {
                    p.progress = 0;
                }

                p.sprite.position.x = p.startX + p.progress * (p.targetX - p.startX);
                p.sprite.position.y = p.startY + p.progress * (p.targetY - p.startY);

                let alpha = 1;
                if (p.progress < 0.15) {
                    alpha = p.progress / 0.15;
                } else if (p.progress > 0.75) {
                    alpha = (1.0 - p.progress) / 0.25;
                }
                p.sprite.material.opacity = alpha * 0.95;

                // Color shift from bright white hot core to task priority color
                p.sprite.material.color.lerpColors(new THREE.Color(0xffffff), p.color, p.progress);
            });

            renderer.render(scene, camera);
        }
        animateGlobe();

        document.getElementById('globe-click-target').addEventListener('click', () => {
            openOverviewPanel();
        });

        // ==========================================
        // 2. CYTOSCAPE & RANDOM TASK SCATTERING
        // ==========================================
        const CENTER_X = window.innerWidth / 2;
        const CENTER_Y = window.innerHeight / 2;
        let liveTasks = [];
        let nodesPositions = {};

        const cy = cytoscape({
            container: document.getElementById('cy'),
            elements: [],
            style: [
                {
                    selector: 'node[type="task_node"]',
                    style: {
                        'label': 'data(label)',
                        'color': '#fff',
                        'font-size': '10px',
                        'font-family': 'Inter',
                        'text-valign': 'bottom',
                        'text-halign': 'center',
                        'text-margin-y': 6,
                        'background-color': '#141526',
                        'width': 34,
                        'height': 34,
                        'border-width': 2,
                        'border-color': 'data(color)',
                        'shadow-blur': 25,
                        'shadow-color': 'data(color)',
                        'shadow-opacity': 0.8
                    }
                },
                {
                    selector: 'edge[type="task_edge"]',
                    style: {
                        'width': 1.5,
                        'line-color': 'data(color)',
                        'opacity': 0.5,
                        'curve-style': 'unbundled-bezier',
                        'control-point-distances': 'data(cpDist)',
                        'control-point-weights': 0.5,
                        'target-arrow-shape': 'circle',
                        'target-arrow-color': 'data(color)'
                    }
                }
            ],
            layout: { name: 'preset' },
            userZoomingEnabled: false,
            userPanningEnabled: false
        });

        function getPriorityColor(priority) {
            const p = (priority || 'medium').toLowerCase();
            if (p === 'high') return '#FB7185';
            if (p === 'medium') return '#FCD34D';
            return '#60A5FA';
        }

        function getFallbackTasks() {
            return [
                { id: 22, content: 'Jarvis Core Maintenance', priority: 'low', status: 'open', effort_estimate: 'large' },
                { id: 103, content: 'Custom Car Rental Website for Cyprus', priority: 'medium', status: 'open', effort_estimate: 'large' },
                { id: 104, content: 'Define detailed requirements for car types & booking flow', priority: 'high', status: 'open', effort_estimate: 'small', parent_id: 103 },
                { id: 105, content: 'Design UI/UX wireframes and mockups', priority: 'high', status: 'open', effort_estimate: 'medium', parent_id: 103 },
                { id: 106, content: 'Develop the frontend using custom code', priority: 'high', status: 'open', effort_estimate: 'large', parent_id: 103 },
                { id: 107, content: 'Develop backend logic for booking system', priority: 'high', status: 'open', effort_estimate: 'large', parent_id: 103 },
                { id: 108, content: 'Design and implement database schema', priority: 'medium', status: 'open', effort_estimate: 'medium', parent_id: 103 },
                { id: 110, content: 'Integrate secure payment gateway', priority: 'high', status: 'open', effort_estimate: 'medium', parent_id: 103 }
            ];
        }

        async function fetchTasks() {
            try {
                const res = await fetch('/tasks');
                if (res.ok) {
                    const data = await res.json();
                    liveTasks = data.tasks || [];
                } else {
                    liveTasks = getFallbackTasks();
                }
            } catch (err) {
                liveTasks = getFallbackTasks();
            }
            renderTaskConstellation(liveTasks);
            renderTaskDatabaseList(liveTasks);
        }

        function renderTaskConstellation(tasks) {
            cy.elements().remove();
            nodesPositions = {};

            if (!tasks || tasks.length === 0) return;

            const taskMap = new Map();
            tasks.forEach(t => {
                t.subtasks = [];
                taskMap.set(t.id, t);
            });

            const roots = [];
            const children = [];
            tasks.forEach(t => {
                if (t.parent_id && taskMap.has(t.parent_id)) {
                    taskMap.get(t.parent_id).subtasks.push(t);
                    children.push(t);
                } else {
                    roots.push(t);
                }
            });

            // Deterministic hash based on task ID to keep positions completely fixed & stable
            function getTaskHash(id, seed) {
                let x = Math.sin(id * 9999 + seed) * 10000;
                return x - Math.floor(x);
            }

            // Scatter Root Tasks in stable random positions strictly outside the central stardust core zone
            roots.forEach((t, idx) => {
                const pColor = getPriorityColor(t.priority);

                const angle = getTaskHash(t.id, 1) * 2 * Math.PI;
                // Minimum radius of 320px keeps tasks outside the central stardust globe boundary
                const radius = 320 + (getTaskHash(t.id, 2) * 140);

                const posX = CENTER_X + radius * Math.cos(angle);
                const posY = CENTER_Y + radius * Math.sin(angle);
                const nodeId = 'task_' + t.id;
                nodesPositions[nodeId] = { x: posX, y: posY };

                cy.add({
                    data: {
                        id: nodeId,
                        label: `#${t.id}`,
                        type: 'task_node',
                        color: pColor,
                        taskObj: t
                    },
                    position: { x: posX, y: posY }
                });
            });

            // Scatter Subtasks in stable random positions around parent tasks
            children.forEach((st, idx) => {
                const pColor = getPriorityColor(st.priority);
                const parentNodeId = 'task_' + st.parent_id;
                const parentPos = nodesPositions[parentNodeId] || { x: CENTER_X, y: CENTER_Y };

                const subAngle = getTaskHash(st.id, 3) * 2 * Math.PI;
                const subRadius = 55 + (getTaskHash(st.id, 4) * 45);

                const posX = parentPos.x + subRadius * Math.cos(subAngle);
                const posY = parentPos.y + subRadius * Math.sin(subAngle);

                const nodeId = 'task_' + st.id;
                nodesPositions[nodeId] = { x: posX, y: posY };

                cy.add({
                    data: {
                        id: nodeId,
                        label: `#${st.id}`,
                        type: 'task_node',
                        color: pColor,
                        taskObj: st
                    },
                    position: { x: posX, y: posY }
                });

                if (cy.getElementById(parentNodeId).length > 0) {
                    cy.add({
                        data: {
                            id: 'edge_' + nodeId,
                            source: parentNodeId,
                            target: nodeId,
                            type: 'task_edge',
                            color: pColor,
                            cpDist: (Math.random() - 0.5) * 20
                        }
                    });
                }
            });

            // Apply exact crosshair target SVG icons matching the original design
            cy.nodes('[type="task_node"]').forEach(n => {
                const color = n.data('color') || '#60A5FA';
                const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>`;
                n.style('background-image', 'data:image/svg+xml;utf8,' + encodeURIComponent(svg));
                n.style('background-width', '55%');
                n.style('background-height', '55%');
                n.style('background-position-x', '50%');
                n.style('background-position-y', '50%');
            });

            // Update 3D laser conduits and energy light pulses directed at root task nodes
            updateTaskConduits(roots);
        }

        // Render Overview Side Panel Tasks List (Mode 1)
        function renderTaskDatabaseList(tasks) {
            const listEl = document.getElementById('tasks-live-list');
            listEl.innerHTML = '';

            const roots = tasks.filter(t => !t.parent_id);
            roots.forEach(t => {
                const priorityClass = t.priority === 'high' ? 'priority-high' : t.priority === 'medium' ? 'priority-medium' : 'priority-low';
                const badgeClass = t.priority === 'high' ? 'badge-high' : t.priority === 'medium' ? 'badge-medium' : 'badge-low';

                const subtasks = tasks.filter(s => s.parent_id === t.id);
                let subHtml = '';
                if (subtasks.length > 0) {
                    subHtml = `<div class="subtasks-container">`;
                    subtasks.forEach(sub => {
                        subHtml += `
                            <div class="subtask-item">
                                <span>#${sub.id} — ${sub.content}</span>
                            </div>
                        `;
                    });
                    subHtml += `</div>`;
                }

                const card = document.createElement('div');
                card.className = `task-card ${priorityClass}`;
                card.onclick = () => openDetailPanel(t);

                card.innerHTML = `
                    <div class="task-card-title">#${t.id} — ${t.content}</div>
                    <div class="task-card-meta">
                        <span class="badge ${badgeClass}">${t.priority || 'medium'}</span>
                        <span class="badge" style="background: rgba(255,255,255,0.08); color: #fff;">${t.status || 'open'}</span>
                        ${t.effort_estimate ? `<span style="color: var(--text-muted);">Effort: ${t.effort_estimate}</span>` : ''}
                    </div>
                    ${subHtml}
                `;
                listEl.appendChild(card);
            });
        }

        // Mode 1: Overview Panel
        function openOverviewPanel() {
            document.getElementById('panel-title').innerText = 'TASK DATABASE';
            document.getElementById('panel-type').innerText = 'LIVE';
            document.getElementById('panel-desc').innerText = 'Live view of all tasks in the second brain database.';
            document.getElementById('panel-overview-section').style.display = 'flex';
            document.getElementById('panel-detail-section').style.display = 'none';
            document.getElementById('action-btn').textContent = 'Add New Task';
            document.getElementById('side-panel').classList.add('open');
        }

        // Mode 2: Specific Task Detail Panel
        function openDetailPanel(task) {
            document.getElementById('panel-title').innerText = `#${task.id} — ${task.content}`;
            document.getElementById('panel-type').innerText = 'TASK';

            const pColor = getPriorityColor(task.priority);
            document.getElementById('panel-type').style.borderColor = pColor;
            document.getElementById('panel-type').style.color = pColor;
            document.getElementById('panel-desc').innerText = `Priority: ${task.priority || 'medium'}, Status: ${task.status || 'open'}.`;

            const metaEl = document.getElementById('specific-task-meta');
            metaEl.innerHTML = `
                <div style="display:flex; gap:8px; align-items:center;">
                    <span class="badge" style="background:${pColor}; color:#000; font-weight:700;">${task.priority || 'medium'}</span>
                    <span class="badge" style="background:rgba(255,255,255,0.1); color:#fff;">${task.status || 'open'}</span>
                </div>
                ${task.effort_estimate ? `<div><strong>Effort Estimate:</strong> ${task.effort_estimate}</div>` : ''}
                ${task.due_date ? `<div><strong>Deadline:</strong> ${task.due_date}</div>` : ''}
            `;

            const childrenEl = document.getElementById('specific-task-children');
            childrenEl.innerHTML = '';

            const subtasks = liveTasks.filter(s => s.parent_id === task.id);
            if (subtasks.length > 0) {
                let subHtml = `<div style="font-weight:600; font-size:11px; margin-bottom:6px; color:#E2E8F0;">SUBTASKS LIST (${subtasks.length})</div>`;
                subtasks.forEach(s => {
                    subHtml += `
                        <div style="font-size:12px; display:flex; align-items:center; gap:6px; background:rgba(255,255,255,0.03); padding:8px; border-radius:6px; border:1px solid rgba(255,255,255,0.08);">
                            <span>#${s.id} — ${s.content}</span>
                        </div>
                    `;
                });
                childrenEl.innerHTML += subHtml;
            }

            document.getElementById('panel-overview-section').style.display = 'none';
            document.getElementById('panel-detail-section').style.display = 'flex';
            document.getElementById('action-btn').textContent = 'Execute Task';
            document.getElementById('side-panel').classList.add('open');
        }

        // Click on Cytoscape node
        cy.on('tap', 'node', function (evt) {
            let node = evt.target;
            let d = node.data();
            if (d.taskObj) {
                openDetailPanel(d.taskObj);

                const scale = 2.2;
                const nodeX = node.position().x;
                const nodeY = node.position().y;
                const shiftX = (CENTER_X - nodeX) * scale;
                const shiftY = (CENTER_Y - nodeY) * scale;

                const wrapper = document.getElementById('map-wrapper');
                wrapper.style.transition = 'transform 0.75s cubic-bezier(0.16, 1, 0.3, 1)';
                wrapper.style.transformOrigin = 'center center';
                wrapper.style.transform = `translate(${shiftX}px, ${shiftY}px) scale(${scale})`;
            }
        });

        cy.on('tap', function (evt) {
            if (evt.target === cy) closePanel();
        });

        function closePanel() {
            document.getElementById('side-panel').classList.remove('open');
            const wrapper = document.getElementById('map-wrapper');
            wrapper.style.transition = 'transform 0.65s cubic-bezier(0.16, 1, 0.3, 1)';
            wrapper.style.transformOrigin = 'center center';
            wrapper.style.transform = 'translate(0px, 0px) scale(1.0)';
        }

        fetchTasks();
        setInterval(() => { fetchTasks(); }, 2500);
    </script>
</body>

</html>
